<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>งูน้อยคิดเลขเร็ว</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff7eb6; --pink2:#ffd1e6; --yellow:#ffd84d; --mint:#7ee0c3; --sky:#7cc8ff;
    --purple:#b38cff; --orange:#ff9f5a; --ink:#4a3b5c; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Mitr',sans-serif;color:var(--ink);min-height:100vh;
    background:linear-gradient(160deg,#ffe3f1 0%,#e3f4ff 50%,#fff6d6 100%);
    display:flex;flex-direction:column;align-items:center;padding:12px 16px 20px;overflow-x:hidden;
  }
  .bubbles span{position:fixed;border-radius:50%;opacity:.35;z-index:0;animation:float 12s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
  .wrap{position:relative;z-index:1;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:10px}
  h1{
    font-size:clamp(24px,6vw,36px);font-weight:600;text-align:center;line-height:1.2;
    background:linear-gradient(90deg,#ff5fa2,#ff9f5a,#ffc93c,#3ccf9e,#4aa8ff,#a07bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(2px 2px 0 #fff);
  }
  .sub{font-size:14px;margin-top:-6px;opacity:.8}
  .hud{display:flex;gap:8px;width:100%;justify-content:space-between;flex-wrap:wrap}
  .pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:500;font-size:15px;
    box-shadow:0 4px 0 rgba(180,140,220,.35);display:flex;align-items:center;gap:6px}
  .question{
    width:100%;background:#fff;border-radius:22px;padding:10px 12px;text-align:center;
    box-shadow:0 6px 0 #ffb3d4;border:3px solid var(--pink);
  }
  .question small{display:block;font-size:13px;opacity:.7}
  .question .q{font-size:clamp(30px,9vw,46px);font-weight:600;color:#ff4f97;letter-spacing:2px}
  .question.shake{animation:shake .4s}
  .question.pop{animation:pop .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes pop{50%{transform:scale(1.08)}}
  .board{position:relative;width:100%;aspect-ratio:1/1;border-radius:24px;overflow:hidden;
    box-shadow:0 8px 0 #9fd9c4;border:4px solid #fff;background:#d8f7ea;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:16px;text-align:center;background:rgba(255,248,252,.93);overflow-y:auto}
  .overlay.hidden{display:none}
  .overlay h2{font-size:clamp(22px,6vw,30px);color:#ff4f97}
  .overlay p{font-size:15px}
  .group{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{border:3px solid transparent;background:#fff;border-radius:16px;padding:8px 14px;font:inherit;font-size:18px;
    cursor:pointer;box-shadow:0 4px 0 #e2d4f5;color:var(--ink);min-width:60px;transition:transform .1s}
  .chip:active{transform:translateY(3px);box-shadow:0 1px 0 #e2d4f5}
  .chip.on{border-color:var(--purple);background:#f1e8ff}
  .chip.op{font-size:24px;font-weight:600}
  .label{font-size:14px;font-weight:500;opacity:.8;margin-bottom:-4px}
  .btn{font:inherit;font-size:22px;font-weight:600;border:none;border-radius:999px;padding:10px 36px;cursor:pointer;
    color:#fff;background:linear-gradient(180deg,#ff8cc0,#ff5fa2);box-shadow:0 6px 0 #d63e80}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d63e80}
  .btn.green{background:linear-gradient(180deg,#6fe0b8,#2fbf8c);box-shadow:0 6px 0 #1f9b6e}
  .stars{font-size:40px;letter-spacing:6px}
  .toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;
    background:#fff;border-radius:20px;padding:10px 22px;font-size:clamp(20px,5vw,28px);font-weight:600;
    box-shadow:0 6px 0 rgba(0,0,0,.12);transition:all .25s;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .controls{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:8px;justify-content:center;margin-top:4px}
  .controls button{font-size:28px;border:none;border-radius:18px;background:#fff;cursor:pointer;
    box-shadow:0 5px 0 #c8b6ec;color:var(--purple)}
  .controls button:active{transform:translateY(4px);box-shadow:0 1px 0 #c8b6ec}
  .controls .up{grid-column:2;grid-row:1}
  .controls .left{grid-column:1;grid-row:2}
  .controls .down{grid-column:2;grid-row:2}
  .controls .right{grid-column:3;grid-row:2}
  .controls .pause{grid-column:3;grid-row:1;font-size:22px}
  .controls .pause{color:var(--orange)}
  .controls .snd{grid-column:1;grid-row:1;font-size:22px}
  .help{font-size:13px;text-align:center;opacity:.75}
  footer{margin-top:6px;background:#fff;border-radius:999px;padding:8px 20px;font-size:15px;
    box-shadow:0 4px 0 #ffc6de}
  footer b{color:#ff4f97}
</style>
</head>
<body>
<div class="bubbles" aria-hidden="true">
  <span style="width:120px;height:120px;background:#ffb3d4;top:5%;left:-30px"></span>
  <span style="width:80px;height:80px;background:#ffe27a;top:30%;right:-20px;animation-delay:2s"></span>
  <span style="width:150px;height:150px;background:#a8dcff;bottom:5%;left:-50px;animation-delay:4s"></span>
  <span style="width:90px;height:90px;background:#b9f0d9;bottom:20%;right:-25px;animation-delay:6s"></span>
</div>

<div class="wrap">
  <h1>🐍 งูน้อยคิดเลขเร็ว 🍎</h1>
  <div class="sub">พางูไปกินคำตอบที่ถูกต้องนะ!</div>

  <div class="hud">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">🏆 <span id="best">0</span></div>
    <div class="pill">🔥 <span id="combo">0</span></div>
    <div class="pill" id="hearts">❤️❤️❤️</div>
  </div>

  <div class="question" id="qbox">
    <small>โจทย์ข้อที่ <span id="qno">1</span></small>
    <div class="q" id="qtext">? + ? = ?</div>
  </div>

  <div class="board" id="board">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>

    <div class="overlay" id="startScreen">
      <h2>🌈 เลือกโหมดการเล่น</h2>
      <div class="label">เครื่องหมาย (เลือกได้หลายอัน)</div>
      <div class="group" id="opGroup">
        <button class="chip op on" data-op="+">+</button>
        <button class="chip op on" data-op="-">−</button>
        <button class="chip op" data-op="x">×</button>
        <button class="chip op" data-op="/">÷</button>
      </div>
      <div class="label">ระดับความยาก</div>
      <div class="group" id="lvGroup">
        <button class="chip on" data-lv="0">🐣 ง่าย</button>
        <button class="chip" data-lv="1">🐥 กลาง</button>
        <button class="chip" data-lv="2">🦅 ยาก</button>
      </div>
      <button class="btn" id="startBtn">เริ่มเล่น ▶</button>
      <p class="help">⌨️ ใช้ลูกศร / W A S D &nbsp;|&nbsp; 📱 ปัดนิ้วบนกระดาน หรือกดปุ่มด้านล่าง</p>
    </div>

    <div class="overlay hidden" id="pauseScreen">
      <h2>⏸️ พักก่อนนะ</h2>
      <button class="btn green" id="resumeBtn">เล่นต่อ ▶</button>
      <button class="chip" id="homeBtn1">🏠 กลับหน้าแรก</button>
    </div>

    <div class="overlay hidden" id="overScreen">
      <h2 id="overTitle">🎉 จบเกมแล้ว!</h2>
      <div class="stars" id="stars">⭐⭐⭐</div>
      <p id="overText"></p>
      <button class="btn" id="againBtn">เล่นอีกครั้ง 🔄</button>
      <button class="chip" id="homeBtn2">🏠 เปลี่ยนโหมด</button>
    </div>
  </div>

  <div class="controls">
    <button class="snd" id="sndBtn" aria-label="เสียง">🔊</button>
    <button class="up" data-d="up" aria-label="ขึ้น">⬆️</button>
    <button class="pause" id="pauseBtn" aria-label="พัก">⏸️</button>
    <button class="left" data-d="left" aria-label="ซ้าย">⬅️</button>
    <button class="down" data-d="down" aria-label="ลง">⬇️</button>
    <button class="right" data-d="right" aria-label="ขวา">➡️</button>
  </div>

  <footer>💖 พัฒนาโดย <b>อาจารย์เจนนี่</b> 💖</footer>
</div>

<script>
(() => {
  const COLS = 12, ROWS = 12;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  const LEVELS = [
    { name: 'ง่าย',  speed: 260, add: 10, mul: 5,  mult: 1 },
    { name: 'กลาง', speed: 215, add: 20, mul: 10, mult: 2 },
    { name: 'ยาก',  speed: 175, add: 50, mul: 12, mult: 3 },
  ];
  const FOOD_COLORS = ['#ff6fa8', '#ffb340', '#4fb8ff', '#a77bff', '#3fcf98'];
  const DIRS = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
  const PRAISE = ['เก่งมาก! 🌟', 'ถูกต้อง! 🎉', 'สุดยอด! 💯', 'เยี่ยมเลย! 🥳', 'ฉลาดจัง! 🧠'];

  let ops = ['+', '-'], level = 0;
  let snake, dir, queue, foods, q, score, lives, combo, correct, total, grow, speed;
  let running = false, paused = false, freezeUntil = 0, lastStep = 0, cell = 30;
  let particles = [], flash = 0, sound = true;

  let best = 0;
  try { best = +localStorage.getItem('snakeMathBest') || 0; } catch (e) {}
  $('best').textContent = best;

  // ---------- sound ----------
  let ac;
  function beep(freq, dur = 0.12, type = 'sine', when = 0) {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      const t = ac.currentTime + when;
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const sfx = {
    good: () => { beep(660); beep(880, .12, 'sine', .1); beep(1100, .18, 'sine', .2); },
    bad:  () => { beep(300, .2, 'triangle'); beep(200, .3, 'triangle', .15); },
    over: () => { [523, 440, 349, 262].forEach((f, i) => beep(f, .25, 'triangle', i * .18)); },
    start:() => { [523, 659, 784].forEach((f, i) => beep(f, .15, 'sine', i * .1)); },
  };

  // ---------- questions ----------
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  function makeQuestion() {
    const L = LEVELS[level];
    const op = ops[rnd(0, ops.length - 1)];
    let a, b, ans, sym;
    if (op === '+') { a = rnd(1, L.add); b = rnd(1, L.add); ans = a + b; sym = '+'; }
    else if (op === '-') { a = rnd(2, L.add); b = rnd(1, a); ans = a - b; sym = '−'; }
    else if (op === 'x') { a = rnd(level ? 2 : 1, L.mul); b = rnd(1, level === 2 ? 12 : 10); ans = a * b; sym = '×'; }
    else { b = rnd(2, L.mul); ans = rnd(1, level === 2 ? 12 : 10); a = b * ans; sym = '÷'; }
    return { text: `${a} ${sym} ${b} = ?`, ans };
  }
  function choices(ans) {
    const set = new Set([ans]);
    const spread = Math.max(3, Math.ceil(ans * 0.25));
    let guard = 0;
    while (set.size < 4 && guard++ < 200) {
      const d = rnd(-spread, spread);
      const v = ans + (d === 0 ? 1 : d);
      if (v >= 0) set.add(v);
    }
    while (set.size < 4) set.add(set.size + ans + 1);
    return [...set].sort(() => Math.random() - .5);
  }

  // ---------- game flow ----------
  function resetSnake() {
    const cy = Math.floor(ROWS / 2);
    snake = [{x:4,y:cy},{x:3,y:cy},{x:2,y:cy}];
    dir = DIRS.right; queue = [];
  }
  function newRound() {
    q = makeQuestion(); total++;
    $('qtext').textContent = q.text;
    $('qno').textContent = total;
    const vals = choices(q.ans);
    foods = [];
    const h = snake[0];
    vals.forEach((v, i) => {
      let p, guard = 0;
      do { p = { x: rnd(0, COLS - 1), y: rnd(0, ROWS - 1) }; guard++; }
      while (guard < 500 && (
        snake.some(s => s.x === p.x && s.y === p.y) ||
        foods.some(f => Math.abs(f.x - p.x) + Math.abs(f.y - p.y) < 2) ||
        Math.abs(h.x - p.x) + Math.abs(h.y - p.y) < 3));
      foods.push({ ...p, v, c: FOOD_COLORS[i % FOOD_COLORS.length], born: performance.now() });
    });
  }
  function start() {
    score = 0; lives = 3; combo = 0; correct = 0; total = 0; grow = 0;
    speed = LEVELS[level].speed; particles = [];
    resetSnake(); newRound(); updateHud();
    ['startScreen','overScreen','pauseScreen'].forEach(id => $(id).classList.add('hidden'));
    running = true; paused = false; freezeUntil = performance.now() + 600; lastStep = 0;
    sfx.start();
  }
  function updateHud() {
    $('score').textContent = score;
    $('combo').textContent = combo;
    $('hearts').textContent = '❤️'.repeat(Math.max(lives, 0)) + '🤍'.repeat(3 - Math.max(lives, 0));
    $('best').textContent = best;
  }
  function toast(msg, color) {
    const t = $('toast');
    t.textContent = msg; t.style.color = color;
    t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1100);
  }
  function anim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  function loseLife(msg) {
    lives--; combo = 0; flash = 1;
    sfx.bad(); anim($('qbox'), 'shake');
    updateHud();
    if (lives <= 0) { gameOver(); return true; }
    toast(msg, '#ff4f6d');
    freezeUntil = performance.now() + 1300;
    return false;
  }
  function gameOver() {
    running = false;
    sfx.over();
    if (score > best) { best = score; try { localStorage.setItem('snakeMathBest', best); } catch (e) {} }
    updateHud();
    const answered = Math.max(total - 1, 0) + (lives <= 0 ? 1 : 0);
    const pct = answered ? correct / answered : 0;
    const n = pct >= .8 ? 3 : pct >= .5 ? 2 : correct > 0 ? 1 : 0;
    $('stars').textContent = '⭐'.repeat(n) + '☆'.repeat(3 - n);
    $('overTitle').textContent = n === 3 ? '🏆 เก่งที่สุดเลย!' : n === 2 ? '🎉 เก่งมาก!' : '💪 สู้ๆ นะ!';
    $('overText').innerHTML = `ตอบถูก <b>${correct}</b> ข้อ &nbsp;•&nbsp; คะแนน <b>${score}</b>` +
      (score === best && score > 0 ? '<br>🥇 ทำสถิติใหม่!' : '');
    $('overScreen').classList.remove('hidden');
  }

  function burst(x, y, color) {
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
        c: [color, '#ffd84d', '#fff', '#ff7eb6'][i % 4], r: 2 + Math.random() * 3 });
    }
  }

  function step() {
    const nd = queue.shift();
    if (nd && !(nd.x === -dir.x && nd.y === -dir.y)) dir = nd;
    const h = snake[0];
    const nh = { x: (h.x + dir.x + COLS) % COLS, y: (h.y + dir.y + ROWS) % ROWS };

    const bodyToCheck = grow > 0 ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === nh.x && s.y === nh.y)) {
      if (!loseLife('อุ๊ย! ชนตัวเอง 🙈')) { resetSnake(); newRound(); }
      return;
    }
    snake.unshift(nh);
    const fi = foods.findIndex(f => f.x === nh.x && f.y === nh.y);
    if (fi >= 0) {
      const f = foods[fi];
      burst((f.x + .5) * cell, (f.y + .5) * cell, f.c);
      if (f.v === q.ans) {
        combo++; correct++;
        score += 10 * LEVELS[level].mult + (combo >= 3 ? combo * 2 : 0);
        grow += 1;
        speed = Math.max(95, speed - 4);
        sfx.good(); anim($('qbox'), 'pop');
        toast(combo >= 3 ? `คอมโบ x${combo}! 🔥` : PRAISE[rnd(0, PRAISE.length - 1)], '#2fbf8c');
        updateHud(); newRound();
      } else {
        if (!loseLife(`คำตอบคือ ${q.ans} นะ 😊`)) newRound();
      }
    }
    if (grow > 0) grow--; else snake.pop();
  }

  // ---------- drawing ----------
  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = r.width / COLS;
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function draw(now) {
    const W = cell * COLS;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      ctx.fillStyle = (x + y) % 2 ? '#c9f2e1' : '#dcf9ec';
      ctx.fillRect(x * cell, y * cell, cell + 1, cell + 1);
    }
    if (!snake) return;

    // foods
    foods.forEach(f => {
      const age = Math.max(0.01, Math.min(1, (now - f.born) / 300));
      const bob = Math.sin(now / 300 + f.x) * cell * .04;
      const cx = (f.x + .5) * cell, cy = (f.y + .5) * cell + bob, r = cell * .47 * age;
      ctx.fillStyle = 'rgba(0,0,0,.08)';
      ctx.beginPath(); ctx.ellipse(cx, (f.y + .92) * cell, r * .8, r * .2, 0, 0, 7); ctx.fill();
      ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.beginPath(); ctx.arc(cx - r * .35, cy - r * .35, r * .25, 0, 7); ctx.fill();
      ctx.fillStyle = '#5bc46a';
      ctx.beginPath(); ctx.ellipse(cx + r * .2, cy - r * .95, r * .28, r * .14, -.5, 0, 7); ctx.fill();
      const s = String(f.v);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `600 ${cell * (s.length >= 3 ? .38 : .5) * age}px Mitr, sans-serif`;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.18)';
      ctx.strokeText(s, cx, cy + 1); ctx.fillText(s, cx, cy + 1);
    });

    // snake body
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const hue = (330 + i * 22) % 360;
      ctx.fillStyle = i === 0 ? '#7ed957' : `hsl(${hue},85%,72%)`;
      const pad = i === 0 ? cell * .04 : cell * .1;
      rr(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * .35);
      ctx.fill();
      if (i > 0) {
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.beginPath(); ctx.arc((s.x + .38) * cell, (s.y + .38) * cell, cell * .1, 0, 7); ctx.fill();
      }
    }
    // head face
    const h = snake[0], hx = (h.x + .5) * cell, hy = (h.y + .5) * cell;
    const px = -dir.y, py = dir.x;
    const ex = dir.x * cell * .12, ey = dir.y * cell * .12;
    [-1, 1].forEach(sd => {
      const x = hx + ex + px * sd * cell * .2, y = hy + ey + py * sd * cell * .2;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, cell * .13, 0, 7); ctx.fill();
      ctx.fillStyle = '#3a2d4a'; ctx.beginPath(); ctx.arc(x + dir.x * cell * .04, y + dir.y * cell * .04, cell * .07, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,120,160,.55)';
      ctx.beginPath(); ctx.arc(hx - ex * .6 + px * sd * cell * .3, hy - ey * .6 + py * sd * cell * .3, cell * .07, 0, 7); ctx.fill();
    });
    if (Math.floor(now / 400) % 3 === 0) {
      ctx.strokeStyle = '#ff4f6d'; ctx.lineWidth = cell * .06; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx + dir.x * cell * .45, hy + dir.y * cell * .45);
      ctx.lineTo(hx + dir.x * cell * .62, hy + dir.y * cell * .62); ctx.stroke();
    }

    // particles
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += .08; p.life -= .025;
      ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,90,120,${flash * .35})`; ctx.fillRect(0, 0, W, W);
      flash = Math.max(0, flash - .04);
    }
  }

  function loop(now) {
    if (running && !paused && now > freezeUntil) {
      if (!lastStep) lastStep = now;
      if (now - lastStep >= speed) { lastStep = now; step(); }
    } else lastStep = now;
    draw(now);
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  function push(name) {
    if (!running || paused) return;
    const d = DIRS[name];
    const last = queue.length ? queue[queue.length - 1] : dir;
    if ((d.x === last.x && d.y === last.y) || (d.x === -last.x && d.y === -last.y)) return;
    if (queue.length < 3) queue.push(d);
  }
  function togglePause() {
    if (!running) return;
    paused = !paused;
    $('pauseScreen').classList.toggle('hidden', !paused);
  }
  const KEYS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
  document.addEventListener('keydown', e => {
    if (KEYS[e.key]) { e.preventDefault(); push(KEYS[e.key]); }
    else if (e.key === ' ' || e.key === 'p' || e.key === 'Escape') { e.preventDefault(); togglePause(); }
    else if (e.key === 'Enter' && !running) start();
  });
  document.querySelectorAll('.controls [data-d]').forEach(b =>
    b.addEventListener('pointerdown', e => { e.preventDefault(); push(b.dataset.d); }));

  let ts = null;
  const board = $('board');
  board.addEventListener('touchstart', e => { const t = e.touches[0]; ts = { x: t.clientX, y: t.clientY }; }, { passive: true });
  board.addEventListener('touchmove', e => { if (running && !paused) e.preventDefault(); }, { passive: false });
  board.addEventListener('touchend', e => {
    if (!ts) return;
    const t = e.changedTouches[0], dx = t.clientX - ts.x, dy = t.clientY - ts.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20)
      push(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    ts = null;
  });

  $('opGroup').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const on = document.querySelectorAll('#opGroup .on');
    if (b.classList.contains('on') && on.length === 1) { toast('เลือกอย่างน้อย 1 อันนะ 😊', '#ff9f5a'); return; }
    b.classList.toggle('on');
    ops = [...document.querySelectorAll('#opGroup .on')].map(x => x.dataset.op);
  });
  $('lvGroup').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('#lvGroup .chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); level = +b.dataset.lv;
  });
  const home = () => { running = false; paused = false;
    ['overScreen','pauseScreen'].forEach(id => $(id).classList.add('hidden'));
    $('startScreen').classList.remove('hidden'); };
  $('startBtn').onclick = start;
  $('againBtn').onclick = start;
  $('resumeBtn').onclick = togglePause;
  $('pauseBtn').onclick = togglePause;
  $('homeBtn1').onclick = home;
  $('homeBtn2').onclick = home;
  $('sndBtn').onclick = () => { sound = !sound; $('sndBtn').textContent = sound ? '🔊' : '🔇'; };

  window.addEventListener('resize', resize);
  resize();
  resetSnake(); foods = []; q = { ans: 0 };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
